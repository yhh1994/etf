name: Update ETF Overlap Data

on:
  schedule:
    - cron: '0 0 1 * *' # Run monthly
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
          
      - name: Run Fetcher & Processor
        run: python fetch.py
        env:
          EDGAR_IDENTITY: "ETFOverlapAnalyst research@example.com"
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ETF overlap JSON data" && git push)
