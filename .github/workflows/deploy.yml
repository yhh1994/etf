name: Build and Deploy ETF Overlap

on:
  schedule:
    - cron: '0 0 1 * *' # Runs on the 1st of every month
  workflow_dispatch:     # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
          
      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify Dependencies
        run: |
          python3 -m pip show edgartools
          python3 -c "from edgar import set_identity, Company; print('EdgarTools imported successfully')"
          
      - name: Run Data Builder Script
        run: python3 build_data.py
        env:
          EDGAR_IDENTITY: "ETFOverlapAnalyst research@example.com"

      - name: Commit and Push etf_data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_data.json
          git commit -m "chore: auto-update etf_data.json [skip ci]" || echo "No changes to commit"
          git push
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: .github/,src/,requirements.txt,build_data.py,app.py,fetch.py
