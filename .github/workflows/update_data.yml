name: Update ETF Holdings Cache

on:
  schedule:
    # Runs on the 5th of every month at midnight UTC
    - cron: '0 0 5 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Fetcher Script
        run: |
          python -c "from src.fetcher import fetch_etf_holdings; fetch_etf_holdings('VOO'); fetch_etf_holdings('VUG'); fetch_etf_holdings('SCHD')"
        env:
          # edgartools requires an email identity for SEC API calls
          EDGAR_IDENTITY: "ETFOverlapAnalyst research@example.com"

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update ETF holdings parquet cache" && git push)
